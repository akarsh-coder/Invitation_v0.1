<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="45%" stop-color="#F3EBDC"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#F3E0A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F3E0A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6D18"/>
      <stop offset="35%" stop-color="#E8C86A"/>
      <stop offset="65%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8C6D18"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A1515" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- outer frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#C59B27" stroke-width="1" opacity="0.35"/>

  <!-- corner ornaments -->
  <path d="M56 56 L56 92 M56 56 L92 56" stroke="#C59B27" stroke-width="2.5" fill="none"/>
  <path d="M1144 56 L1144 92 M1144 56 L1108 56" stroke="#C59B27" stroke-width="2.5" fill="none"/>
  <path d="M56 574 L56 538 M56 574 L92 574" stroke="#C59B27" stroke-width="2.5" fill="none"/>
  <path d="M1144 574 L1144 538 M1144 574 L1108 574" stroke="#C59B27" stroke-width="2.5" fill="none"/>

  <!-- lotus motif -->
  <g transform="translate(600 118)" opacity="0.9">
    <ellipse cx="0" cy="8" rx="22" ry="10" fill="none" stroke="#C59B27" stroke-width="1.2"/>
    <path d="M0 -14 C-8 2 -14 10 0 20 C14 10 8 2 0 -14 Z" fill="#C59B27" opacity="0.35"/>
    <path d="M-18 6 C-8 -4 0 -2 0 14" fill="none" stroke="#C59B27" stroke-width="1.2"/>
    <path d="M18 6 C8 -4 0 -2 0 14" fill="none" stroke="#C59B27" stroke-width="1.2"/>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#8C6D18" letter-spacing="3">|| Sri Mahaganapathaye Namaha ||</text>

  <text x="600" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6B3030" letter-spacing="5" font-style="italic">Together with their families</text>

  <text x="600" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#4A1515" letter-spacing="1">
    Akarsh
  </text>
  <text x="600" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#C59B27" font-style="italic">&amp;</text>
  <text x="600" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#4A1515" letter-spacing="1">
    Manasa
  </text>

  <line x1="380" y1="438" x2="820" y2="438" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>

  <text x="600" y="478" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#5A1818" letter-spacing="4" font-weight="500">12 &amp; 13 DECEMBER 2026</text>
  <text x="600" y="514" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#8C6D18" letter-spacing="2">Bengaluru, Karnataka</text>

  <text x="600" y="572" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#6B3030" letter-spacing="6" opacity="0.85">WEDDING INVITATION</text>
</svg>
