    <!-- Dynamic Absolute URL Resolver for WhatsApp Crawlers -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.startsWith('file:')) {
            var fullImageUrl = origin + '/og-banner.jpg';
            var fullPageUrl = window.location.href;

            var ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute('content', fullImageUrl);

            var ogSecure = document.querySelector('meta[property="og:image:secure_url"]');
            if (ogSecure) ogSecure.setAttribute('content', fullImageUrl);

            var twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) twitterImage.setAttribute('content', fullImageUrl);

            var ogUrl = document.createElement('meta');
            ogUrl.setAttribute('property', 'og:url');
            ogUrl.setAttribute('content', fullPageUrl);
            document.head.appendChild(ogUrl);
          }
        } catch (e) {}
      })();
    </script>
